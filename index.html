<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon FELIX UNISEX</title>
  <style>
    :root {
      --primary: #d4af37;
      --primary-glow: rgba(212, 175, 55, 0.35);
      --bg: #0d0d0d;
      --card-bg: rgba(26, 26, 26, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #221c0f 0%, #0d0d0d 70%);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Logo & Header Animations */
    header {
      text-align: center;
      padding: 10px 0 25px;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary), transparent, var(--primary));
      z-index: 0;
      animation: spin 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    header img {
      position: relative;
      z-index: 1;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
      box-shadow: 0 0 20px var(--primary-glow);
      transition: transform 0.4s ease;
    }

    header:hover img {
      transform: scale(1.05) rotate(3deg);
    }

    h1 {
      font-size: 24px;
      letter-spacing: 1px;
      color: var(--primary);
      margin: 12px 0 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 0;
      letter-spacing: 0.5px;
    }

    .section-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 25px 0 12px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--primary), transparent);
    }

    /* Interactive Cards */
    .category-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    /* Hover & Mobile Touch Surprise Effect */
    .category-card:hover, .category-card:active {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--primary);
      box-shadow: 0 10px 25px -5px var(--primary-glow), 0 0 10px rgba(212, 175, 55, 0.15);
      background: rgba(35, 30, 20, 0.9);
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .category-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .arrow-icon {
      color: var(--primary);
      font-size: 12px;
      transition: transform 0.3s ease;
      background: rgba(212, 175, 55, 0.1);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .category-card.active .arrow-icon {
      transform: rotate(180deg);
      background: var(--primary);
      color: #000;
    }

    /* Sub-services Accordion Animation */
    .sub-services {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0, 1, 0, 1);
    }

    .category-card.active .sub-services {
      max-height: 500px;
      opacity: 1;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      transition: all 0.4s ease-in-out;
    }

    .sub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 6px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .sub-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .sub-name {
      font-size: 14px;
      color: #ececec;
    }

    .price-tag {
      background: linear-gradient(135deg, #d4af37, #f3e5ab);
      color: #000;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #000;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: all 0.3s ease;
    }

    .btn:hover, .btn:active {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
      filter: brightness(1.1);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: #181818;
      padding: 24px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 12px;
      background: #252525;
      border: 1px solid #3d3d3d;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    footer {
      text-align: center;
      margin-top: 35px;
      font-size: 12px;
      color: var(--text-muted);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    footer a:hover { opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-wrapper">
      <img src="223291_3.jpg" alt="Salon FELIX Logo" onerror="this.src='https://via.placeholder.com/95?text=FELIX'">
    </div>
    <h1>Salon FELIX UNISEX</h1>
    <p class="subtitle">Hair • Beauty • Tattoo | Sahan Anusha</p>
  </header>

  <div class="section-title">අපගේ සේවාවන් (Services)</div>

  <div id="services-list"></div>

  <button class="btn" onclick="openBookingModal()">Appointment එකක් දාන්න (Book Now)</button>

  <footer>
    <p>© Salon FELIX UNISEX</p>
    <p><a href="javascript:void(0)" onclick="openAdminModal()">Salon Owner / Admin Login</a></p>
  </footer>
</div>

<!-- Booking Modal -->
<div id="bookingModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--primary);">Booking එකක් දාන්න</h3>
    <input type="text" id="custName" placeholder="ඔබේ නම (Your Name)">
    <input type="tel" id="custPhone" placeholder="දුරකථන අංකය (Phone Number)">
    <select id="serviceSelect"></select>
    <input type="date" id="bookDate">
    <input type="time" id="bookTime">
    <button class="btn" onclick="sendWhatsApp()">WhatsApp මගින් Confirm කරන්න</button>
    <button class="btn" style="background:#333; color:#fff; box-shadow:none;" onclick="closeModal('bookingModal')">වසා දමන්න</button>
  </div>
</div>

<!-- Admin Modal -->
<div id="adminModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--primary);">Admin Dashboard Login</h3>
    <input type="password" id="adminPass" placeholder="Admin Password">
    <button class="btn" onclick="loginAdmin()">Login</button>
    <button class="btn" style="background:#333; color:#fff; box-shadow:none;" onclick="closeModal('adminModal')">වසා දමන්න</button>
    
    <div id="adminPanel" style="display:none; margin-top:15px; border-top:1px solid #333; padding-top:12px;">
      <h4 style="margin:5px 0 10px; font-size:14px; color:var(--primary);">Ganan & Services Edit Karanna:</h4>
      <input type="text" id="newSubName" placeholder="Sub-service Name">
      <input type="number" id="newSubPrice" placeholder="Mila (Rs.)">
      <select id="catSelect">
        <option value="0">Hair Cut & Styling</option>
        <option value="1">Beauty & Care</option>
        <option value="2">Tattoo & Arts</option>
      </select>
      <button class="btn" onclick="addCustomService()">Service එක එකතු කරන්න</button>
    </div>
  </div>
</div>

<script>
  const defaultData = [
    {
      category: "Hair Cut & Styling",
      desc: "Gents & Ladies haircuts, styling & coloring",
      subs: [
        { name: "Gents Normal Haircut", price: 1000 },
        { name: "Gents Beard Trim & Style", price: 800 },
        { name: "Ladies Haircut & Wash", price: 2500 },
        { name: "Hair Color / Highlights", price: 3500 }
      ]
    },
    {
      category: "Beauty & Care",
      desc: "Facials, cleanup & skin treatments",
      subs: [
        { name: "Clean Up", price: 2000 },
        { name: "Full Facial", price: 4500 },
        { name: "Pedicure / Manicure", price: 3000 }
      ]
    },
    {
      category: "Tattoo & Arts",
      desc: "Custom permanent & temporary tattoos",
      subs: [
        { name: "Custom Tattoo (per sq inch)", price: 1500 },
        { name: "Temporary Tattoo", price: 1000 }
      ]
    }
  ];

  let salonData = JSON.parse(localStorage.getItem('felix_services')) || defaultData;

  function renderServices() {
    const container = document.getElementById('services-list');
    const select = document.getElementById('serviceSelect');
    container.innerHTML = '';
    select.innerHTML = '';

    salonData.forEach((cat, cIdx) => {
      let subHtml = '';
      cat.subs.forEach(s => {
        subHtml += `
          <div class="sub-item">
            <span class="sub-name">${s.name}</span>
            <span class="price-tag">Rs. ${s.price}</span>
          </div>
        `;
        select.innerHTML += `<option value="${s.name} (Rs.${s.price})">${cat.category} - ${s.name} (Rs.${s.price})</option>`;
      });

      container.innerHTML += `
        <div class="category-card" id="card-${cIdx}" onclick="toggleCat(${cIdx})">
          <div class="category-header">
            <div>
              <div class="category-title">${cat.category}</div>
              <div class="category-desc">${cat.desc}</div>
            </div>
            <span class="arrow-icon">▼</span>
          </div>
          <div class="sub-services">
            ${subHtml}
          </div>
        </div>
      `;
    });
  }

  function toggleCat(idx) {
    const card = document.getElementById(`card-${idx}`);
    card.classList.toggle('active');
  }

  function openBookingModal() {
    document.getElementById('bookingModal').style.display = 'flex';
  }

  function openAdminModal() {
    document.getElementById('adminModal').style.display = 'flex';
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  function sendWhatsApp() {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const service = document.getElementById('serviceSelect').value;
    const date = document.getElementById('bookDate').value;
    const time = document.getElementById('bookTime').value;

    if(!name || !phone || !date || !time) {
      alert('කරුණාකර සියලු විස්තර ඇතුළත් කරන්න.');
      return;
    }

    const msg = `Hello Salon FELIX, Mama Booking ekak danna kamathi.%0A%0AName: ${name}%0APhone: ${phone}%0AService: ${service}%0ADate: ${date}%0ATime: ${time}`;
    window.open(`https://wa.me/94703191313?text=${msg}`, '_blank');
  }

  function loginAdmin() {
    const pass = document.getElementById('adminPass').value;
    if(pass === 'sahan@flix') {
      document.getElementById('adminPanel').style.display = 'block';
      alert('Login Successful!');
    } else {
      alert('වැරදි Password එකක්!');
    }
  }

  function addCustomService() {
    const name = document.getElementById('newSubName').value;
    const price = document.getElementById('newSubPrice').value;
    const catIdx = document.getElementById('catSelect').value;

    if(name && price) {
      salonData[catIdx].subs.push({ name: name, price: parseInt(price) });
      localStorage.setItem('felix_services', JSON.stringify(salonData));
      renderServices();
      alert('අලුත් Service එක එකතු කෙරිණි!');
      document.getElementById('newSubName').value = '';
      document.getElementById('newSubPrice').value = '';
    }
  }

  renderServices();
</script>

</body>
</html>
